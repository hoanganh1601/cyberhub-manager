[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhub-manager"
version = "0.1.0"
description = "Ứng dụng desktop và web quản lý quán net"
readme = "README.md"
requires-python = ">=3.11" # Hỗ trợ Python từ 3.11 trở lên
dependencies = [
    "customtkinter==6.0.0",
    "Pillow==12.3.0",
    "mysql-connector-python==26.7.0",
    "python-dotenv==1.2.4",
    "bcrypt==5.0.0",
] # dependencies

[project.optional-dependencies]
web = [
    "Flask==3.1.3",
    "gunicorn==26.2.0; platform_system != 'Windows'",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
] # thư viện chỉ dùng khi phát triển test

[project.scripts]
cyberhub-manager = "cyberhub_manager.app:main"
cyberhub-web = "cyberhub_manager.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"] # tìm package trong thư mục src

[tool.pytest.ini_options] # thống nhất
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["cyberhub_manager"]
branch = true

[tool.setuptools.package-data]
"cyberhub_manager.ui.assets" = ["*.png", "fonts/*.ttf", "fonts/*-OFL.txt"]
"cyberhub_manager.web" = ["templates/*.html", "static/*.css", "static/*.js"]
