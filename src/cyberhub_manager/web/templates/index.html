<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b101b" />
    <meta
      name="description"
      content="CyberHub Manager — quản lý phòng máy, khách hàng, ví tiền và doanh thu."
    />
    <title>CyberHub Manager</title>
    <link rel="icon" type="image/png" href="/assets/cyberhub_logo_dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='voucher.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='ad.css') }}" />
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    <script defer src="{{ url_for('static', filename='p1.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal2.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal3.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal_menu.js') }}"></script>
    <script defer src="{{ url_for('static', filename='menu_admin.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal_voucher.js') }}"></script>
    <script defer src="{{ url_for('static', filename='voucher_admin.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal_game.js') }}"></script>
    <script defer src="{{ url_for('static', filename='game_admin.js') }}"></script>
    <script defer src="{{ url_for('static', filename='portal_ad.js') }}"></script>
    <script defer src="{{ url_for('static', filename='ad_admin.js') }}"></script>
  </head>
  <body data-customer-portal="{{ 'true' if customer_portal else 'false' }}">
    <div id="app">
      <div class="boot">
        <img src="/assets/cyberhub_logo_dark.png" alt="CyberHub Manager" /><span
          class="spinner"
        ></span>
        <p>CyberHub Manager</p>
      </div>
    </div>
    <div id="notifications" aria-live="polite" aria-atomic="true"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript>Vui lòng bật JavaScript để sử dụng CyberHub Manager.</noscript>
  </body>
</html>
