<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b101b" />
    <meta
      name="description"
      content="CyberHub Manager — quản lý phòng máy, khách hàng, ví tiền và doanh thu."
    />
    <title>CyberHub Manager</title>
    <link rel="icon" type="image/png" href="/assets/cyberhub_logo_dark.png" />
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    <script defer src="{{ url_for('static', filename='p1.js') }}"></script>
  </head>
  <body data-customer-portal="{{ 'true' if customer_portal else 'false' }}">
    <div id="app">
      <div class="boot">
        <img src="/assets/cyberhub_logo_dark.png" alt="CyberHub Manager" /><span
          class="spinner"
        ></span>
        <p>CyberHub Manager</p>
      </div>
    </div>
    <div id="notifications" aria-live="polite" aria-atomic="true"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript>Vui lòng bật JavaScript để sử dụng CyberHub Manager.</noscript>
  </body>
</html>
