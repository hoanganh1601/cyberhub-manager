<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CyberHub · Bảo mật tài khoản</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1220;color:#eef5ff}
    *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}
    main{width:min(100%,440px);padding:32px;border:1px solid #294057;border-radius:20px;background:#111d30;box-shadow:0 20px 70px #0005}
    h1{font-size:24px;margin:0 0 8px}p{color:#a9bdd5;line-height:1.5;margin:0 0 24px}
    label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;padding:13px;border:1px solid #39516c;border-radius:9px;background:#0b1525;color:inherit;font:inherit}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#10bbdf;color:#081622;font:700 16px inherit;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}a{color:#5bd6f5}#message{min-height:24px;margin-top:16px;color:#82e0c5}
  </style>
</head>
<body><main>
  <h1 id="title">Bảo mật tài khoản</h1>
  <p id="description"></p>
  <form id="form">
    <div id="email-field"><label for="email">Email đã đăng ký</label><input id="email" type="email" autocomplete="email" maxlength="254"></div>
    <div id="password-fields" hidden>
      <label for="password">Mật khẩu mới</label><input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="72">
      <label for="confirmation">Xác nhận mật khẩu</label><input id="confirmation" type="password" autocomplete="new-password" minlength="6" maxlength="72">
    </div>
    <button id="submit" type="submit">Tiếp tục</button>
  </form>
  <div id="message" role="status"></div>
  <p style="margin-top:20px"><a href="/customer">Về trang đăng nhập</a></p>
</main>
<script>
  const fragment=new URLSearchParams(location.hash.slice(1));
  const token=fragment.get('token');
  history.replaceState(null,'',location.pathname);
  const activate=location.pathname==='/activate';
  const form=document.getElementById('form'), message=document.getElementById('message');
  const title=document.getElementById('title'), description=document.getElementById('description');
  title.textContent=activate?'Kích hoạt tài khoản':'Khôi phục mật khẩu';
  description.textContent=token?'Đặt mật khẩu mới để tiếp tục sử dụng tài khoản.':activate?'Nhập email để gửi lại liên kết kích hoạt.':'Nhập email đã xác minh. Nếu tài khoản tồn tại, chúng tôi sẽ gửi liên kết.';
  document.getElementById('email-field').hidden=!!token;
  document.getElementById('password-fields').hidden=!token;
  form.addEventListener('submit',async event=>{
    event.preventDefault();message.textContent='';const button=document.getElementById('submit');button.disabled=true;
    try{
      const session=await fetch('/api/session',{credentials:'same-origin'}).then(r=>r.json());
      const path=token?(activate?'activate':'reset'):(activate?'resend':'request-reset');
      const payload=token?{token,password:document.getElementById('password').value,confirmation:document.getElementById('confirmation').value}:{email:document.getElementById('email').value};
      const response=await fetch('/api/customer-email/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':session.csrf_token},body:JSON.stringify(payload)});
      const result=await response.json();
      if(!response.ok)throw new Error(result.error?.message||'Không thể hoàn tất. Vui lòng thử lại.');
      message.textContent=token?'Đã cập nhật mật khẩu. Bạn có thể đăng nhập.':'Nếu tài khoản phù hợp, liên kết sẽ được gửi.';
      form.hidden=!!token;
    }catch(error){message.textContent=error.message}finally{button.disabled=false}
  });
</script></body></html>
